<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bikeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d5b9f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e41886;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bikeGradient)" opacity="0.1"/>
  
  <!-- Main Bike Body -->
  <ellipse cx="300" cy="280" rx="180" ry="60" fill="#1d5b9f" filter="url(#shadow)"/>
  
  <!-- Wheels -->
  <circle cx="180" cy="320" r="40" fill="#333" stroke="#666" stroke-width="8"/>
  <circle cx="420" cy="320" r="40" fill="#333" stroke="#666" stroke-width="8"/>
  
  <!-- Wheel Spokes -->
  <g stroke="#999" stroke-width="2">
    <line x1="160" y1="320" x2="200" y2="320"/>
    <line x1="180" y1="300" x2="180" y2="340"/>
    <line x1="165" y1="305" x2="195" y2="335"/>
    <line x1="195" y1="305" x2="165" y2="335"/>
  </g>
  
  <g stroke="#999" stroke-width="2">
    <line x1="400" y1="320" x2="440" y2="320"/>
    <line x1="420" y1="300" x2="420" y2="340"/>
    <line x1="405" y1="305" x2="435" y2="335"/>
    <line x1="435" y1="305" x2="405" y2="335"/>
  </g>
  
  <!-- Seat -->
  <ellipse cx="280" cy="240" rx="50" ry="15" fill="#e41886"/>
  
  <!-- Handlebars -->
  <rect x="280" y="200" width="40" height="8" fill="#333" rx="4"/>
  <circle cx="285" cy="204" r="3" fill="#666"/>
  <circle cx="315" cy="204" r="3" fill="#666"/>
  
  <!-- Headlight -->
  <circle cx="320" cy="250" r="12" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <circle cx="320" cy="250" r="6" fill="#ffeb3b"/>
  
  <!-- VinFast Logo on Bike -->
  <circle cx="300" cy="280" r="20" fill="#fff" opacity="0.9"/>
  <text x="300" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1d5b9f">V</text>
  
  <!-- Electric Symbol -->
  <g transform="translate(350, 200)">
    <path d="M0 0 L-8 12 L4 12 L0 24 L8 12 L-4 12 Z" fill="#ffeb3b" stroke="#ffa000" stroke-width="1"/>
  </g>
  
  <!-- Text -->
  <text x="300" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1d5b9f">VinFast E-Bike</text>
  <text x="300" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">Xe máy điện thông minh</text>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="4" fill="#e41886" opacity="0.6"/>
  <circle cx="500" cy="120" r="6" fill="#1d5b9f" opacity="0.4"/>
  <circle cx="80" cy="160" r="3" fill="#e41886" opacity="0.8"/>
  <circle cx="520" cy="180" r="5" fill="#1d5b9f" opacity="0.5"/>
</svg>