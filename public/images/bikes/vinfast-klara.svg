<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="klaraGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d5b9f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Main Body -->
  <ellipse cx="200" cy="220" rx="140" ry="45" fill="url(#klaraGradient)"/>
  
  <!-- Wheels -->
  <circle cx="120" cy="250" r="30" fill="#333" stroke="#666" stroke-width="6"/>
  <circle cx="280" cy="250" r="30" fill="#333" stroke="#666" stroke-width="6"/>
  
  <!-- Seat -->
  <ellipse cx="180" cy="190" rx="40" ry="12" fill="#e41886"/>
  
  <!-- Handlebars -->
  <rect x="180" y="160" width="30" height="6" fill="#333" rx="3"/>
  
  <!-- Headlight -->
  <circle cx="220" cy="200" r="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <circle cx="220" cy="200" r="4" fill="#ffeb3b"/>
  
  <!-- Text -->
  <text x="200" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1d5b9f">VinFast Klara</text>
  <text x="200" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Tầm hoạt động: 80km</text>
  <text x="200" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Sạc nhanh 3h</text>
</svg>