<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="impesGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d5b9f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Main Body (Larger for premium model) -->
  <ellipse cx="200" cy="220" rx="150" ry="50" fill="url(#impesGradient)"/>
  
  <!-- Wheels (Larger) -->
  <circle cx="115" cy="250" r="32" fill="#333" stroke="#666" stroke-width="7"/>
  <circle cx="285" cy="250" r="32" fill="#333" stroke="#666" stroke-width="7"/>
  
  <!-- Premium Seat -->
  <ellipse cx="175" cy="185" rx="45" ry="14" fill="#8b5cf6"/>
  
  <!-- Handlebars -->
  <rect x="175" y="155" width="35" height="7" fill="#333" rx="3.5"/>
  
  <!-- Premium Headlight -->
  <circle cx="225" cy="195" r="10" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <circle cx="225" cy="195" r="5" fill="#ffeb3b"/>
  
  <!-- Digital Display -->
  <rect x="180" y="170" width="20" height="8" fill="#000" rx="2"/>
  <rect x="182" y="172" width="16" height="4" fill="#00e676"/>
  
  <!-- Premium Badge -->
  <circle cx="200" cy="220" r="15" fill="#ffd700" stroke="#ffb300" stroke-width="2"/>
  <text x="200" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">★</text>
  
  <!-- Text -->
  <text x="200" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1d5b9f">VinFast Impes</text>
  <text x="200" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Tầm hoạt động: 90km</text>
  <text x="200" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Công suất mạnh mẽ</text>
</svg>