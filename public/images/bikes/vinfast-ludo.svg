<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ludoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e41886;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Main Body -->
  <ellipse cx="200" cy="220" rx="130" ry="40" fill="url(#ludoGradient)"/>
  
  <!-- Wheels -->
  <circle cx="130" cy="250" r="28" fill="#333" stroke="#666" stroke-width="5"/>
  <circle cx="270" cy="250" r="28" fill="#333" stroke="#666" stroke-width="5"/>
  
  <!-- Seat -->
  <ellipse cx="185" cy="195" rx="35" ry="10" fill="#1d5b9f"/>
  
  <!-- Handlebars -->
  <rect x="185" y="165" width="25" height="5" fill="#333" rx="2.5"/>
  
  <!-- Headlight -->
  <circle cx="215" cy="205" r="7" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <circle cx="215" cy="205" r="3" fill="#ffeb3b"/>
  
  <!-- Removable Battery -->
  <rect x="170" y="210" width="20" height="15" fill="#333" rx="2"/>
  <circle cx="180" cy="217" r="2" fill="#00e676"/>
  
  <!-- Text -->
  <text x="200" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e41886">VinFast Ludo</text>
  <text x="200" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Tầm hoạt động: 60km</text>
  <text x="200" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Pin rời tiện lợi</text>
</svg>