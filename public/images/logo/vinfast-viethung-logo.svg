<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <!-- VinFast Brand Colors -->
  <defs>
    <linearGradient id="vinfastGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d5b9f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e41886;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="40" cy="40" r="35" fill="#1d5b9f" stroke="#e41886" stroke-width="2"/>
  
  <!-- VinFast V Symbol -->
  <path d="M25 25 L40 55 L55 25" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 35 L40 50 L50 35" stroke="#e41886" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- VinFast Text -->
  <text x="90" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1d5b9f">VinFast</text>
  
  <!-- Việt Hùng Text -->
  <text x="90" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#e41886">Việt Hùng</text>
  <text x="90" y="65" font-family="Arial, sans-serif" font-size="10" fill="#666666">Đại lý chính hãng</text>
  
  <!-- Decorative Elements -->
  <circle cx="175" cy="20" r="3" fill="#e41886"/>
  <circle cx="185" cy="25" r="2" fill="#1d5b9f"/>
  <circle cx="180" cy="35" r="2.5" fill="#e41886" opacity="0.7"/>
</svg>