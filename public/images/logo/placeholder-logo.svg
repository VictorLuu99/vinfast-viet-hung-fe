<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <!-- VinFast Brand Colors -->
  <defs>
    <linearGradient id="vinfastGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d5b9f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e41886;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Logo Circle -->
  <circle cx="40" cy="40" r="25" fill="#1d5b9f"/>
  
  <!-- VinFast V Symbol -->
  <path d="M30 30 L40 50 L50 30" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="45" r="2" fill="#e41886"/>
  
  <!-- VinFast Text -->
  <text x="80" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d5b9f">VinFast</text>
  
  <!-- Việt Hùng Text -->
  <text x="80" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#e41886">Việt Hùng</text>
  <text x="80" y="60" font-family="Arial, sans-serif" font-size="8" fill="#666666">Đại lý chính hãng</text>
</svg>